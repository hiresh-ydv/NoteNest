# Render blueprint for the NoteNest backend (free plan).
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
# Render reads this file and creates the web service with the settings below.
#
# Note: the free plan has an ephemeral filesystem, so the SQLite database and
# uploaded PDFs reset on every restart. NOTENEST_SEED_ON_STARTUP reloads the
# demo notes automatically on each boot so the site is never empty.
services:
  - type: web
    name: notenest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      # Long random HMAC key for session tokens (auto-generated by Render).
      - key: NOTENEST_SECRET_KEY
        generateValue: true
      # Served over HTTPS by Render, and reached same-site through the Vercel
      # proxy, so a Secure, SameSite=Lax cookie is correct here.
      - key: NOTENEST_COOKIE_SECURE
        value: "true"
      - key: NOTENEST_COOKIE_SAMESITE
        value: lax
      # Reload demo notes on each boot (the free disk is ephemeral).
      - key: NOTENEST_SEED_ON_STARTUP
        value: "true"
      # Set this to your Vercel URL, e.g. https://notenest.vercel.app
      # (Render will ask for it during blueprint creation.)
      - key: NOTENEST_CORS_ORIGINS
        sync: false
